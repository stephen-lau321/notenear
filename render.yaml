services:
  - type: web
    name: notenear-api
    env: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install && npx prisma generate && npx nest build
    startCommand: cd backend && npx prisma db push --accept-data-loss && npx prisma db seed && node dist/main.js
    healthCheckPath: /api/v1/products
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGINS
        value: https://stephen-lau321.github.io,http://localhost:5173,http://localhost:4173
      - key: AMAP_API_KEY
        value: f1392fa410619aad5a6b18ee6da3c168
      - key: DATABASE_URL
        fromDatabase:
          name: notenear-db
          property: connectionString

databases:
  - name: notenear-db
    databaseName: streetmusic
    user: streetmusic
    plan: free
    region: singapore
